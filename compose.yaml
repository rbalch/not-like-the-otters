name: not-like-the-otters

services:
  dev:
    container_name: not-like-the-otters
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - 8010:8010
    volumes:
      # app
      - ./:/app:cached
      - ../:/workspace
      - /app/.venv  # Prevents host from overwriting container's venv

      # Named volumes for persistent data
      - root-history:/home/dev/history
      - vscode-server:/home/dev/.vscode-server

      # Shared credential volumes, external so every project reuses the same ones and
      # `docker compose down -v` cannot destroy them. Deliberately NOT bind mounts of
      # ~/.ssh and ~/.config/gh: the host ssh config is a home-manager symlink into
      # /nix/store, which does not resolve inside a Debian container, and a bind mount
      # would expose every host key rather than the one that is wanted here.
      # Set up once per machine — see README, "Container credentials".
      - dev-ssh:/home/dev/.ssh
      - dev-gh:/home/dev/.config/gh

      # User config mounts
      - ~/.config/gcloud:/home/dev/.config/gcloud
      # - ~/.gemini:/home/dev/.gemini
      # - ~/.cache/google-vscode-extension:/home/dev/.cache/google-vscode-extension
      - ~/.claude:/home/dev/.claude
      - ~/.claude.json:/home/dev/.claude.json
      - ~/.codex:/home/dev/.codex
      # Nix vault (universal context layer)
      - ~/.nix-vault:/home/dev/.nix-vault
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
    env_file:
      - .env
    # environment:
    #   GOOGLE_CLOUD_PROJECT: your-gcp-project

volumes:
  root-history:
  vscode-server:

  # Machine-wide, not project-scoped. Create once with:
  #   docker volume create dev-ssh && docker volume create dev-gh
  dev-ssh:
    external: true
  dev-gh:
    external: true
